<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>$MEMO | Match the Faces</title>
<meta name="description" content="A memory game starring the big-brained $MEMO. Flip the cards. Match the faces.">
<link rel="icon" href="icon.png">

<!-- ===== X PLAYER CARD (makes it playable inside a tweet) =====
     Replace https://itsmemopf.github.io/memo/ with your real HTTPS address (keep the trailing slash).
     Bump v=1 to v=2 etc. whenever you update the game, so X re-reads it. -->
<meta name="twitter:card" content="player">
<meta name="twitter:site" content="@YOURHANDLE">
<meta name="twitter:title" content="$MEMO: Match the Faces">
<meta name="twitter:description" content="Big brain? Prove it. Flip the cards and match every face.">
<meta name="twitter:image" content="https://itsmemopf.github.io/memo/player-card.jpg">
<meta name="twitter:player" content="https://itsmemopf.github.io/memo/?embed=1&amp;v=1">
<meta name="twitter:player:width" content="480">
<meta name="twitter:player:height" content="480">
<meta property="og:title" content="$MEMO: Match the Faces">
<meta property="og:description" content="Big brain? Prove it. Flip the cards and match every face.">
<meta property="og:image" content="https://itsmemopf.github.io/memo/player-card.jpg">
<meta property="og:url" content="https://itsmemopf.github.io/memo/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17122b; --bg2:#231b42; --ink:#fff7ee; --muted:#b9add8;
  --back:#6b3fd6; --back2:#8d5cff; --accent:#ffd23f; --flesh:#f08a73;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0}
a{color:inherit}

/* ---------- full site ---------- */
.site{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:28px 16px 48px;
  background:radial-gradient(1200px 600px at 50% -10%, #3a2775 0%, transparent 60%), var(--bg)}
.hero{text-align:center;max-width:720px}
.hero img{width:96px;height:96px;border-radius:50%;background:var(--accent);border:4px solid var(--ink);box-shadow:0 6px 0 #0006}
.hero h1{font-family:"Lilita One",sans-serif;font-size:clamp(44px,9vw,84px);line-height:.95;letter-spacing:1px;margin-top:12px;
  text-shadow:0 5px 0 var(--back)}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);font-size:18px;font-weight:800;margin-top:10px}
.ca{display:inline-flex;align-items:center;gap:10px;margin-top:18px;background:var(--bg2);border:2px solid #ffffff22;border-radius:999px;padding:8px 8px 8px 18px;max-width:100%}
.ca code{font-family:ui-monospace,Menlo,monospace;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ca button{background:var(--accent);color:#1b1230;font-weight:900;border-radius:999px;padding:8px 14px;white-space:nowrap}
.links{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.links a{font-weight:900;text-decoration:none;background:#ffffff14;border-radius:999px;padding:8px 16px}
.links a:hover{background:#ffffff26}

.modes{display:flex;gap:8px;margin:30px 0 14px;background:var(--bg2);padding:6px;border-radius:999px}
.modes button{background:transparent;color:var(--muted);font-weight:900;padding:10px 18px;border-radius:999px;font-size:15px}
.modes button.on{background:var(--ink);color:#1b1230}
.modes small{display:block;font-size:11px;opacity:.7;font-weight:800}

/* ---------- game shell (shared) ---------- */
.game{position:relative;width:100%;max-width:980px;display:flex;flex-direction:column;align-items:center}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:var(--boardW);max-width:100%;margin-bottom:10px;font-weight:900}
.stats{display:flex;gap:8px}
.pill{background:var(--bg2);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.pill b{color:var(--accent)}
.newbtn{background:var(--accent);color:#1b1230;font-weight:900;border-radius:999px;padding:7px 14px;font-size:14px;box-shadow:0 3px 0 #b8901a}
.newbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8901a}

.board{display:grid;grid-template-columns:repeat(var(--cols),var(--card));gap:var(--gap);perspective:900px}
.card{width:var(--card);height:var(--card);position:relative;background:none;padding:0;border-radius:var(--radius);
  transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,1.4,.5,1)}
.card.up,.card.done{transform:rotateY(180deg)}
.side{position:absolute;inset:0;border-radius:var(--radius);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{background:
   repeating-linear-gradient(45deg, var(--back) 0 10px, var(--back2) 10px 20px);
  border:3px solid #ffffff55;box-shadow:0 4px 0 #0007;display:grid;place-items:center}
.back span{font-family:"Lilita One",sans-serif;font-size:calc(var(--card)*.42);color:var(--ink);text-shadow:0 3px 0 #2a145f;line-height:1}
.back em{position:absolute;bottom:6%;font-style:normal;font-weight:900;font-size:calc(var(--card)*.12);letter-spacing:.5px;color:#ffffffcc}
.front{transform:rotateY(180deg);background:var(--c);border:3px solid var(--ink);box-shadow:0 4px 0 #0007}
.front img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block;pointer-events:none;user-select:none}
.card:not(.up):not(.done):hover .back{filter:brightness(1.12)}
.card.done .front{animation:pop .5s ease .25s}
.card.done .front::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 4px var(--accent)}
.card.miss .front{animation:shake .35s ease}
@keyframes pop{0%{transform:rotateY(180deg) scale(1)}40%{transform:rotateY(180deg) scale(1.12)}100%{transform:rotateY(180deg) scale(1)}}
@keyframes shake{0%,100%{translate:0}25%{translate:-4px}75%{translate:4px}}

/* win overlay */
.win{position:absolute;inset:0;display:none;place-items:center;background:#17122bdd;backdrop-filter:blur(3px);border-radius:18px;z-index:5}
.win.show{display:grid;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.winbox{text-align:center;padding:18px;max-width:340px}
.winbox img{width:110px;height:110px;border-radius:50%;background:var(--accent);border:4px solid var(--ink);animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.winbox h2{font-family:"Lilita One",sans-serif;font-size:38px;line-height:1;margin-top:10px;text-shadow:0 4px 0 var(--back)}
.winbox p{color:var(--muted);font-weight:800;margin-top:6px}
.winbox p b{color:var(--ink)}
.winbtns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.winbtns a,.winbtns button{display:block;text-decoration:none;font-weight:900;border-radius:999px;padding:11px 16px;font-size:15px}
.btn-x{background:var(--ink);color:#111}
.btn-site{background:var(--accent);color:#1b1230}
.btn-again{background:#ffffff1a;color:var(--ink)}
.best{margin-top:10px;color:var(--muted);font-weight:800;font-size:14px}

/* ---------- embed mode (inside the tweet) ---------- */
body.embed{overflow:hidden;background:radial-gradient(600px 400px at 50% -20%, #3a2775 0%, transparent 70%), var(--bg)}
body.embed .site{display:none}
.embedwrap{display:none}
body.embed .embedwrap{display:flex;height:100vh;width:100vw;flex-direction:column;align-items:center;justify-content:center;padding:2.5vh 2.5vw}
body.embed .bar{margin-bottom:1.6vh}
body.embed .brand{font-family:"Lilita One",sans-serif;font-size:clamp(16px,5vw,24px);text-shadow:0 2px 0 var(--back)}
body.embed .brand span{color:var(--accent)}
body.embed .pill{font-size:clamp(11px,3vw,14px);padding:5px 10px}
body.embed .newbtn{font-size:clamp(11px,3vw,14px);padding:6px 11px}
body.embed .win{border-radius:0}
body.embed .winbox h2{font-size:clamp(26px,8vw,38px)}
body.embed .winbox img{width:clamp(64px,20vw,110px);height:clamp(64px,20vw,110px)}

/* preview mode (used to make player-card.jpg) */
body.preview .win{display:none!important}
body.preview .bar{justify-content:center}
body.preview .stats,body.preview .newbtn{display:none}
body.preview .brand{font-size:30px}
</style>
</head>
<body>

<!-- FULL SITE -->
<div class="site">
  <header class="hero">
    <img src="cards/laugh.webp" alt="">
    <h1>BIG BRAIN <span>$MEMO</span></h1>
    <p>His forehead holds everything. Can yours? Flip the cards. Match the faces.</p>
    <div class="ca"><code id="caText">CA coming soon</code><button id="copyCa">Copy</button></div>
    <div class="links">
      <a id="xLink" href="#" target="_blank" rel="noopener">X / Twitter</a>
      <a id="buyLink" href="#" target="_blank" rel="noopener">Buy</a>
    </div>
  </header>

  <nav class="modes" id="modes">
    <button data-mode="easy" class="on">Easy<small>8 pairs</small></button>
    <button data-mode="medium">Medium<small>12 pairs</small></button>
    <button data-mode="hard">Hard<small>16 pairs</small></button>
  </nav>

  <div class="game" id="siteGame"></div>
</div>

<!-- EMBED (only shown with ?embed=1) -->
<div class="embedwrap"><div class="game" id="embedGame"></div></div>

<template id="gameTpl">
  <div class="bar">
    <div class="brand"><span></span></div>
    <div class="stats"><div class="pill">Moves <b data-moves>0</b></div><div class="pill"><b data-time>0:00</b></div></div>
    <button class="newbtn" data-new>New game</button>
  </div>
  <div class="board" data-board></div>
  <div class="win" data-win>
    <div class="winbox">
      <img src="cards/laugh.webp" alt="">
      <h2>BIG BRAIN!</h2>
      <p>Matched them all in <b data-wmoves>0</b> moves and <b data-wtime>0:00</b></p>
      <div class="winbtns">
        <a class="btn-x" data-share target="_blank" rel="noopener">Brag on X</a>
        <a class="btn-site" data-sitelink target="_blank" rel="noopener">Get $MEMO</a>
        <button class="btn-again" data-again>Play again</button>
      </div>
      <div class="best" data-best></div>
    </div>
  </div>
</template>

<script>
/* ===================== EDIT THESE ===================== */
const CONFIG = {
  name:     "MEMO",                    // coin name
  ticker:   "$MEMO",                   // ticker
  ca:       "",                        // contract address ("" shows "CA coming soon")
  siteUrl:  "https://itsmemopf.github.io/memo/",  // your live site (same as in the meta tags)
  xHandle:  "YOURHANDLE",              // without the @
  buyUrl:   "",                        // pump.fun / dex link
};
/* ====================================================== */

// Ordered most distinct first. Easy uses the first 8, medium 12, hard all 16.
const FACES = [
  ["shocked","#FFD23F"],["sad","#5BA8FF"],["laugh","#7BE07B"],["crying","#B79CFF"],
  ["angry","#FF6B6B"],["sideeye","#FF9ED2"],["disgusted","#4FD8C8"],["sleepy","#FFA552"],
  ["smile","#FFF3B0"],["smug","#9AD0FF"],["worried","#C7F59B"],["squint","#E3C9FF"],
  ["grin","#FFB3A7"],["sly","#2FC4FF"],["happy","#FFE066"],["content","#A6F0E4"],
];
const MODES = { easy:{pairs:8, cols:4, mcols:4}, medium:{pairs:12, cols:6, mcols:4}, hard:{pairs:16, cols:8, mcols:4} };

const params = new URLSearchParams(location.search);
const isEmbed = params.has("embed") || params.has("preview");
const isPreview = params.has("preview");
if (isEmbed) document.body.classList.add("embed");
if (isPreview) document.body.classList.add("preview");

const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const fmt = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };

// preload images so the first flip is instant
FACES.forEach(([f]) => { const i = new Image(); i.src = `cards/${f}.webp`; });

function makeGame(root, opts){
  root.appendChild(document.getElementById("gameTpl").content.cloneNode(true));
  const $ = s => root.querySelector(s);
  const board = $("[data-board]"), win = $("[data-win]");
  const movesEl = $("[data-moves]"), timeEl = $("[data-time]");
  $(".brand span").textContent = opts.embed ? CONFIG.ticker : "";
  if (!opts.embed) $(".brand").style.display = "none";

  let mode = opts.mode, first = null, lock = false, moves = 0, matched = 0, secs = 0, timer = null, started = false;

  function size(){
    const m = MODES[mode];
    let cols, rows, availW, availH, gap;
    if (opts.embed){
      cols = m.cols; rows = m.pairs*2/cols;
      gap = Math.round(Math.min(innerWidth, innerHeight) * 0.018);
      availW = innerWidth * 0.95;
      availH = innerHeight * 0.95 - $(".bar").offsetHeight - innerHeight*0.016;
    } else {
      const narrow = innerWidth < 640;
      cols = narrow ? m.mcols : m.cols; rows = m.pairs*2/cols;
      gap = narrow ? 8 : 12;
      availW = Math.min(root.clientWidth, 980);
      availH = narrow ? Infinity : Math.max(360, innerHeight - 140);
    }
    const card = Math.floor(Math.min((availW - gap*(cols-1))/cols, (availH - gap*(rows-1))/rows, 150));
    root.style.setProperty("--cols", cols);
    root.style.setProperty("--card", card+"px");
    root.style.setProperty("--gap", gap+"px");
    root.style.setProperty("--radius", Math.max(8, Math.round(card*.13))+"px");
    root.style.setProperty("--boardW", (card*cols + gap*(cols-1))+"px");
  }

  function tick(){ secs++; timeEl.textContent = fmt(secs); }

  function deal(){
    clearInterval(timer); timer=null; started=false;
    first=null; lock=false; moves=0; matched=0; secs=0;
    movesEl.textContent="0"; timeEl.textContent="0:00"; win.classList.remove("show");
    const set = FACES.slice(0, MODES[mode].pairs);
    const deck = shuffle([...set, ...set]);
    board.innerHTML = "";
    deck.forEach(([face,color]) => {
      const b = document.createElement("button");
      b.className = "card"; b.dataset.face = face; b.setAttribute("aria-label","Hidden card");
      b.innerHTML = `<div class="side back"><span>?</span><em>${CONFIG.ticker}</em></div>
                     <div class="side front" style="--c:${color}"><img src="cards/${face}.webp" alt="${face}" draggable="false"></div>`;
      b.addEventListener("click", () => flip(b));
      board.appendChild(b);
    });
    size();
    if (isPreview) previewPose();
  }

  function flip(c){
    if (lock || c === first || c.classList.contains("up") || c.classList.contains("done")) return;
    if (!started){ started = true; timer = setInterval(tick, 1000); }
    c.classList.add("up"); c.setAttribute("aria-label", c.dataset.face);
    if (!first){ first = c; return; }
    moves++; movesEl.textContent = moves;
    const a = first; first = null;
    if (a.dataset.face === c.dataset.face){
      a.classList.add("done"); c.classList.add("done");
      matched++;
      if (matched === MODES[mode].pairs) setTimeout(finish, 650);
    } else {
      lock = true;
      setTimeout(() => { a.classList.add("miss"); c.classList.add("miss"); }, 380);
      setTimeout(() => {
        a.classList.remove("up","miss"); c.classList.remove("up","miss");
        a.setAttribute("aria-label","Hidden card"); c.setAttribute("aria-label","Hidden card");
        lock = false;
      }, 900);
    }
  }

  function finish(){
    clearInterval(timer);
    $("[data-wmoves]").textContent = moves;
    $("[data-wtime]").textContent = fmt(secs);
    const key = "memo-best-" + mode, best = store.get(key);
    let line = "";
    if (!best || moves < best.moves || (moves === best.moves && secs < best.secs)){
      store.set(key, {moves, secs}); line = best ? "New personal best!" : "";
    } else line = `Your best: ${best.moves} moves, ${fmt(best.secs)}`;
    $("[data-best]").textContent = line;
    const txt = `My brain is massive. Matched every ${CONFIG.ticker} face in ${moves} moves (${fmt(secs)}). Beat that 🧠`;
    $("[data-share]").href = "https://x.com/intent/tweet?text=" + encodeURIComponent(txt) + "&url=" + encodeURIComponent(CONFIG.siteUrl);
    const sl = $("[data-sitelink]");
    if (opts.embed){ sl.href = CONFIG.siteUrl; sl.textContent = "Play hard mode + get " + CONFIG.ticker; }
    else if (CONFIG.buyUrl){ sl.href = CONFIG.buyUrl; sl.textContent = "Get " + CONFIG.ticker; }
    else sl.style.display = "none";
    win.classList.add("show");
  }

  // Freeze a nice half-solved board for the preview image
  function previewPose(){
    const cards = [...board.children];
    const faces = ["laugh","shocked","angry"];
    faces.forEach(f => cards.filter(c=>c.dataset.face===f).forEach(c=>c.classList.add("done")));
    const lone = cards.find(c=>c.dataset.face==="crying"); if (lone) lone.classList.add("up");
    $(".brand span").textContent = "";
    $(".brand").innerHTML = '<span>' + CONFIG.ticker + '</span> MATCH THE FACES';
  }

  $("[data-new]").addEventListener("click", deal);
  $("[data-again]").addEventListener("click", deal);
  addEventListener("resize", size);

  deal();
  return { setMode(m){ mode = m; deal(); } };
}

if (isEmbed){
  makeGame(document.getElementById("embedGame"), { embed:true, mode:"easy" });
} else {
  const g = makeGame(document.getElementById("siteGame"), { embed:false, mode:"easy" });
  document.getElementById("modes").addEventListener("click", e => {
    const b = e.target.closest("button[data-mode]"); if (!b) return;
    document.querySelectorAll("#modes button").forEach(x => x.classList.toggle("on", x===b));
    g.setMode(b.dataset.mode);
  });
  // header links
  const caText = document.getElementById("caText");
  caText.textContent = CONFIG.ca || "CA coming soon";
  document.getElementById("copyCa").addEventListener("click", e => {
    if (!CONFIG.ca) return;
    navigator.clipboard?.writeText(CONFIG.ca).then(() => { e.target.textContent = "Copied"; setTimeout(()=>e.target.textContent="Copy",1400); }).catch(()=>{});
  });
  const xl = document.getElementById("xLink"); xl.href = "https://x.com/" + CONFIG.xHandle;
  const bl = document.getElementById("buyLink"); if (CONFIG.buyUrl) bl.href = CONFIG.buyUrl; else bl.style.display = "none";
}
</script>
</body>
</html>
